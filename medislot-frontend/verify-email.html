<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediSlot | Verify your email</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <div class="container-fluid px-3 px-md-4">
      <div class="row justify-content-center align-items-center min-vh-100 py-4">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
          <section class="login-card" aria-labelledby="verifyTitle">
            <div class="brand-block text-center">
              <div class="brand-icon" aria-hidden="true">+</div>
              <h1 id="verifyTitle" class="brand-title">MediSlot</h1>
              <p class="brand-subtitle mb-0">Verify your email</p>
            </div>
            <p class="text-center">We sent a verification code to <strong id="emailText"></strong>.</p>
            <div id="messageBox" class="alert d-none" role="alert" aria-live="polite"></div>
            <form id="verifyForm" novalidate>
              <div class="mb-3">
                <label for="code" class="form-label">Verification code</label>
                <input type="text" class="form-control form-control-lg text-center" id="code" name="code"
                  inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="6-digit code" required>
              </div>
              <button type="submit" id="verifyBtn" class="btn btn-primary btn-lg w-100 login-button">Verify email</button>
            </form>
            <div class="text-center mt-3">
              <button type="button" id="resendBtn" class="btn btn-link">Resend code</button>
            </div>
            <p class="text-center mb-0"><a href="login.html">Back to login</a></p>
          </section>
        </div>
      </div>
    </div>
  </main>
  <script src="js/verify-email.js"></script>
</body>
</html>
