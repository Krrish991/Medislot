<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediSlot | Doctor Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/doctor-dashboard.css">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top"><div class="container">
<a class="navbar-brand fw-bold" href="doctor-dashboard.html">MediSlot</a>
<div class="d-flex align-items-center gap-2"><span id="doctorName" class="small text-muted"></span><button id="logoutBtn" class="btn btn-outline-danger btn-sm">Logout</button></div>
</div></nav>
<main class="container py-4">
<div id="alertBox"></div>
<section class="card shadow-sm mb-4"><div class="card-body"><div class="d-flex justify-content-between align-items-center flex-wrap gap-2"><div><h4 class="mb-1">Doctor Dashboard</h4><p class="text-muted mb-0">Manage your profile, weekly clinic schedule, time slots and appointments.</p></div><span id="doctorStatus" class="badge text-bg-secondary">Doctor account loading...</span></div>
<div class="small text-success mt-3" id="doctorAutoConnection"></div>
<div class="small text-muted mt-2"></div>
</div></section>
<div id="dashboardContent" class="d-none">
<div class="row g-4">
<div class="col-lg-6"><section class="card shadow-sm h-100"><div class="card-body"><h5>Profile Management</h5><form id="profileForm"><div class="mb-2"><label class="form-label">Specialization <span class="required">*</span></label><input id="specialization" class="form-control" required></div><div class="mb-2"><label class="form-label">Qualification</label> <span class="required">*</span><input id="qualification" class="form-control" required></div><div class="row"><div class="col-6 mb-2"><label class="form-label">Experience (years)</label> <span class="required">*</span><input id="experienceYears" type="number" min="0" class="form-control"></div><div class="col-6 mb-2"><label class="form-label">Consultation Fee</label> <span class="required">*</span><input id="consultationFee" type="number" min="0" step="0.01" class="form-control"></div></div><div class="mb-2"><label class="form-label">Available Days</label> <span class="required">*</span><input id="availableDays" class="form-control" placeholder="MONDAY,WEDNESDAY"></div><button class="btn btn-success">Save Profile</button></form></div></section></div>
<div class="col-lg-6"><section class="card shadow-sm h-100"><div class="card-body"><h5>Add Weekly Clinic Schedule</h5><form id="scheduleForm"><div class="mb-2"><label class="form-label">Clinic</label><select id="clinicId" class="form-select" required><option value="">Loading clinics...</option></select></div><div class="row"><div class="col-6 mb-2"><label class="form-label">Day</label><select id="dayOfWeek" class="form-select"><option>MONDAY</option><option>TUESDAY</option><option>WEDNESDAY</option><option>THURSDAY</option><option>FRIDAY</option><option>SATURDAY</option><option>SUNDAY</option></select></div><div class="col-3 mb-2"><label class="form-label">Start</label><input id="startTime" type="time" class="form-control" required></div><div class="col-3 mb-2"><label class="form-label">End</label><input id="endTime" type="time" class="form-control" required></div></div><button class="btn btn-primary">Add Schedule</button></form><hr><div id="scheduleList" class="schedule-list"></div></div></section></div>
<div class="col-lg-6"><section class="card shadow-sm h-100"><div class="card-body"><h5>Add Appointment Time Slot</h5><form id="slotForm"><div class="row"><div class="col-6 mb-2"><label class="form-label">Date</label><input id="slotDate" type="date" class="form-control" required></div><div class="col-6 mb-2"><label class="form-label">Time</label><input id="slotTime" type="time" class="form-control" required></div></div><button class="btn btn-success">Create Slot</button></form><hr><h6>Available Slots</h6><div class="row g-2"><div class="col-8"><input id="viewSlotDate" type="date" class="form-control"></div><div class="col-4"><button id="loadSlotsBtn" class="btn btn-outline-primary w-100">Load</button></div></div><div id="slotList" class="mt-3"></div></div></section></div>
<div class="col-lg-6"><section class="card shadow-sm h-100"><div class="card-body"><div class="d-flex justify-content-between"><h5>Appointments</h5><button id="refreshAppointmentsBtn" class="btn btn-sm btn-outline-secondary">Refresh</button></div><div id="appointmentList" class="mt-3"></div></div></section></div>
</div></div></main>
<script src="js/doctor-dashboard.js"></script><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
