<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediSlot | Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <div class="container-fluid px-3 px-md-4">
      <div class="row justify-content-center align-items-center min-vh-100 py-4">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">
          <section class="login-card" aria-labelledby="resetTitle">
            <div class="brand-block text-center">
              <div class="brand-icon" aria-hidden="true">+</div>
              <h1 id="resetTitle" class="brand-title">Reset Password</h1>
              <p class="brand-subtitle mb-0">Answer your security question to continue</p>
            </div>

            <div id="messageBox" class="alert d-none" role="alert" aria-live="polite"></div>

            <form id="forgotForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Registered email</label>
                <input type="email" class="form-control form-control-lg" id="email"
                       placeholder="Enter your registered email" maxlength="254" required>
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <button type="submit" id="findQuestionButton" class="btn btn-primary btn-lg w-100">
                <span id="findButtonText">Continue</span>
              </button>
            </form>

            <form id="resetForm" class="d-none" novalidate>
              <div class="mb-3">
                <label class="form-label">Security question</label>
                <div id="securityQuestion" class="form-control form-control-lg question-box"></div>
              </div>

              <div class="mb-3">
                <label for="securityAnswer" class="form-label">Your answer</label>
                <input type="text" class="form-control form-control-lg" id="securityAnswer"
                       autocomplete="off" required>
                <div class="invalid-feedback">Please enter your security answer.</div>
              </div>

              <div class="mb-3">
                <label for="newPassword" class="form-label">New password</label>
                <input type="password" class="form-control form-control-lg" id="newPassword"
                       minlength="8" autocomplete="new-password" required>
                <div class="invalid-feedback">Password must be at least 8 characters with uppercase, lowercase, number and special character.</div>
              </div>

              <div class="mb-3">
                <label for="confirmNewPassword" class="form-label">Confirm new password</label>
                <input type="password" class="form-control form-control-lg" id="confirmNewPassword"
                       autocomplete="new-password" required>
                <div class="invalid-feedback">Passwords do not match.</div>
              </div>

              <button type="submit" id="resetButton" class="btn btn-primary btn-lg w-100">
                Update password
              </button>
            </form>

            <div class="text-center mt-3">
              <a href="login.html">Back to login</a>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>
  <script src="js/forgot-password.js"></script>
</body>
</html>
