<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediSlot | Login</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <div class="container-fluid px-3 px-md-4">
      <div class="row justify-content-center align-items-center min-vh-100 py-4">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

          <section class="login-card" aria-labelledby="loginTitle">
            <div class="brand-block text-center">
              <div class="brand-icon" aria-hidden="true">+</div>
              <h1 id="loginTitle" class="brand-title">MediSlot</h1>
              <p class="brand-subtitle mb-0">Doctor Appointment  System</p>
            </div>

            <div id="messageBox" class="alert d-none" role="alert" aria-live="polite"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input
                  type="email"
                  class="form-control form-control-lg"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  autocomplete="email"
                  maxlength="254"
                  required
                >
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-2">
                <label for="password" class="form-label">Password</label>
                <div class="password-wrap">
                  <input
                    type="password"
                    class="form-control form-control-lg"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                  >
                  <button
                    type="button"
                    id="togglePassword"
                    class="password-toggle"
                    aria-label="Show password"
                    title="Show password"
                  >Show</button>
                </div>
                <div class="invalid-feedback" id="passwordFeedback">Password is required.</div>
              </div>

              <div class="d-flex justify-content-between align-items-center small helper-row mb-3">
                <a href="forgot-password.html" class="text-decoration-none">Forgot password?</a>
              </div>

              <button type="submit" id="loginButton" class="btn btn-primary btn-lg w-100 login-button">
                <span id="buttonText">Login</span>
                <span id="buttonSpinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
              </button>
            </form>

            <div class="register-divider"><span>or</span></div>
            <button type="button" id="googleLoginBtn" class="btn btn-outline-secondary btn-lg w-100 d-flex align-items-center justify-content-center gap-2 mb-3">
              <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true">
                <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.25 5.48-4.73 7.18l7.66 5.95c4.48-4.14 7.11-10.24 7.11-17.6z"/>
                <path fill="#FBBC05" d="M10.53 28.59A14.4 14.4 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.9 23.9 0 0 0 0 24c0 3.87.93 7.55 2.56 10.78l7.97-6.19z"/>
                <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.9-5.8l-7.66-5.95c-2.13 1.43-4.86 2.27-8.24 2.27-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
              </svg>
              <span>Continue with Google</span>
            </button>

            <div class="register-divider">
              <span>New to MediSlot?</span>
            </div>

            <a href="register.html" class="btn btn-outline-primary btn-lg w-100">
              Create an account
            </a>

            <p class="footer-note text-center mb-0">
              MediSlot • Secure appointment workflow
            </p>
          </section>

        </div>
      </div>
    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
