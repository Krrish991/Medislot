<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediSlot | Login</title>

  <!-- Bootstrap 5.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="login-page">
    <div class="container-fluid px-3 px-md-4">
      <div class="row justify-content-center align-items-center min-vh-100 py-4">
        <div class="col-12 col-sm-10 col-md-8 col-lg-5 col-xl-4">

          <section class="login-card" aria-labelledby="loginTitle">
            <div class="brand-block text-center">
              <div class="brand-icon" aria-hidden="true">+</div>
              <h1 id="loginTitle" class="brand-title">MediSlot</h1>
              <p class="brand-subtitle mb-0">Doctor Appointment  System</p>
            </div>

            <div id="messageBox" class="alert d-none" role="alert" aria-live="polite"></div>

            <form id="loginForm" novalidate>
              <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input
                  type="email"
                  class="form-control form-control-lg"
                  id="email"
                  name="email"
                  placeholder="Enter your email"
                  autocomplete="email"
                  maxlength="254"
                  required
                >
                <div class="invalid-feedback">Please enter a valid email address.</div>
              </div>

              <div class="mb-2">
                <label for="password" class="form-label">Password</label>
                <div class="password-wrap">
                  <input
                    type="password"
                    class="form-control form-control-lg"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                  >
                  <button
                    type="button"
                    id="togglePassword"
                    class="password-toggle"
                    aria-label="Show password"
                    title="Show password"
                  >Show</button>
                </div>
                <div class="invalid-feedback" id="passwordFeedback">Password is required.</div>
              </div>

              <div class="d-flex justify-content-between align-items-center small helper-row mb-3">
                <a href="forgot-password.html" class="text-decoration-none">Forgot password?</a>
              </div>

              <button type="submit" id="loginButton" class="btn btn-primary btn-lg w-100 login-button">
                <span id="buttonText">Login</span>
                <span id="buttonSpinner" class="spinner-border spinner-border-sm d-none" aria-hidden="true"></span>
              </button>
            </form>

            <div class="register-divider">
              <span>New to MediSlot?</span>
            </div>

            <a href="register.html" class="btn btn-outline-primary btn-lg w-100">
              Create an account
            </a>

            <p class="footer-note text-center mb-0">
              MediSlot • Secure appointment workflow
            </p>
          </section>

        </div>
      </div>
    </div>
  </main>

  <script src="js/login.js"></script>
</body>
</html>
